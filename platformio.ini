; ═════════════════════════════════════════════════════════════════════
; Firmware Monorepo — PlatformIO configuration
;
; https://docs.platformio.org/page/projectconf.html
;
; ─────────────────────────────────────────────────────────────────────
; STRUCTURE
;   [common]            pure-software libs safe for EVERY env (incl. native tests)
;   [ht_common]         CAN DBC + proto — real hardware boards only (Teensy + STM32)
;   [teensy_hw_common]  Teensy-only hardware libs (extends ht_common)
;   [teensy_common]     base every Teensy board inherits
;   [stm32_common]      base every STM32 board inherits
;   [native_common]     base for native SIL test envs
;
;   Each board defines a <board>_base that `extends` its hardware base and
;   overrides ONLY what differs (board, flags, libs). The flashable
;   environments (env:*) then extend that board base and pick an upload
;   method.
;
; NAMING CONVENTION
;   <board>-prod          production build, flashed to the vehicle
;   <board>_SIL_tests     Software-in-the-Loop: native, all hardware mocked,
;                         run via `pio test -e ...`
;
; NOTE on build_flags inheritance: PlatformIO REPLACES build_flags when a
; child redefines them (it does not append). Any child that sets its own
; build_flags therefore starts with ${<parent>.build_flags} to pull the
; inherited flags back in before adding its own.
; ═════════════════════════════════════════════════════════════════════


; ─────────────────────────────────────────────────────────────────────
; SHARED — pure-software libs every env uses (incl. native SIL tests)
; ─────────────────────────────────────────────────────────────────────
[common]
lib_deps_shared =
    etlcpp/Embedded Template Library@20.39.4
    nanopb/Nanopb@0.4.91

; ─────────────────────────────────────────────────────────────────────
; SHARED — CAN DBC + proto, used by ALL hardware boards (Teensy + STM32)
; HT_CAN is the vehicle CAN DBC (message/signal definitions); it is
; hardware-agnostic. NOT pulled into native SIL tests (they mock CAN).
; ─────────────────────────────────────────────────────────────────────
[ht_common]
lib_deps =
    https://github.com/hytech-racing/HT_CAN/releases/download/264/can_lib.tar.gz
    https://github.com/hytech-racing/HT_proto/releases/download/2026-06-14T06_30_48/hytech_msgs_pb_lib.tar.gz

; ─────────────────────────────────────────────────────────────────────
; SHARED — Teensy-only hardware libs (extends the shared CAN/proto set)
; ─────────────────────────────────────────────────────────────────────
[teensy_hw_common]
lib_deps =
    ${ht_common.lib_deps}
    https://github.com/ssilverman/QNEthernet#v0.26.0
    https://github.com/KSU-MS/pio-git-hash-gen#7998b5b3f8a2464209b0e73338717998bcf511ee
    blemasle/MCP23017@^2.0.0
    arkhipenko/TaskScheduler@^3.8.5


; ─────────────────────────────────────────────────────────────────────
; BASE — every Teensy env inherits this
; ─────────────────────────────────────────────────────────────────────
[teensy_common]
platform          = teensy@5.2.0
board             = teensy41
framework         = arduino
monitor_speed     = 115200
upload_protocol   = teensy-cli
lib_ldf_mode      = deep+
build_unflags     = -std=gnu++11
build_flags       =
    -std=c++17
    -D TEENSY_OPT_SMALLEST_CODE
check_tool        = clangtidy
check_severity    = medium, high
check_flags       =
    clangtidy: --config-file=./.clang-tidy
check_src_filters =
    +<include/*>
    +<lib/*>
    +<src/*>
extra_scripts     = pre:scripts/set_directory.py
lib_extra_dirs    =
    .pio/libdeps/shared
    shared-lib


; ─────────────────────────────────────────────────────────────────────
; BASE — every STM32 env inherits this
; Board, HSE_VALUE, per-peripheral HAL modules, USB identity, linker
; script and libs are set per-board
; ─────────────────────────────────────────────────────────────────────
[stm32_common]
platform          = ststm32
framework         = arduino
monitor_speed     = 115200
build_unflags     = -std=gnu++11
build_flags       =
    -std=c++17
    -D USE_HAL_DRIVER
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
check_tool        = clangtidy
check_severity    = medium, high
check_flags       =
    clangtidy: --config-file=./.clang-tidy
check_src_filters =
    +<include/*>
    +<lib/*>
    +<src/*>
test_framework    = googletest
extra_scripts     = pre:scripts/set_directory.py
lib_extra_dirs    =
    .pio/libdeps/shared
    shared-lib


; ─────────────────────────────────────────────────────────────────────
; BASE — native SIL test environments
; ─────────────────────────────────────────────────────────────────────
[native_common]
platform        = native
test_framework  = googletest
build_unflags   = -std=gnu++11
extra_scripts   = pre:scripts/set_directory.py
lib_ldf_mode    = deep+
lib_extra_dirs  = shared-lib


; ─────────────────────────────────────────────────────────────────────
; Default environments (one production build per board)
; ─────────────────────────────────────────────────────────────────────
[platformio]
default_envs =
    acu-prod
    ccu-prod
    vcf-prod
    vcr-prod
    dash-dfu-prod
    pdb-dfu-prod





; ═════════════════════════════════════════════════════════════════════
; ACU — Accumulator Control Unit  (Teensy 4.1)
; ═════════════════════════════════════════════════════════════════════
[env:acu-prod]
extends          = teensy_common
custom_subsystem = ACU
build_src_filter =
    +<**/*.cpp>
    -<main_can_test.cpp>
    -<main_ethernet_test.cpp>
    -<main_spi_dma_test.cpp>
    -<main_spi_test.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${teensy_hw_common.lib_deps}
    SPI


; SIL — build/run natively, all hardware mocked. Do NOT upload.
[env:acu_SIL_tests]
extends          = native_common
custom_subsystem = ACU
build_flags =
    -std=c++17
    -g
    -D TESTING_SYSTEMS
build_src_filter = -<*>
lib_ignore       = shared-interfaces-lib
lib_deps =
    ${common.lib_deps_shared}
    google/googletest@^1.15.2


; BMS SPI (DMA) hardware test
[env:acu_spi_test]
extends          = teensy_common
custom_subsystem = ACU
build_src_filter =
    -<**/*.cpp>
    +<main_spi_dma_test.cpp>
    +<ACU_Constants.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${teensy_hw_common.lib_deps}
    SPI





