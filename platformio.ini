; ═════════════════════════════════════════════════════════════════════
; Dashboard — STM32H750VB
; ═════════════════════════════════════════════════════════════════════

; Base H750 config — not a runnable env, inherited by H750_dfu and H750_stlink
[genericSTM32H750VB]
extends              = stm32_common
src_dir              = Dashboard/src
test_dir             = Dashboard/test
platform             = ststm32
board                = genericSTM32H750VB
board_build.ldscript = Dashboard/STM32H750VB_FLASH.ld
build_flags          =
    -std=c++17
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBD_VID=0x0483
    -D USBD_PID=0x0003
    -D USE_HAL_DRIVER
    -D HAL_PCD_MODULE_ENABLED
    -D HAL_FDCAN_MODULE_ENABLED
    -D HSE_VALUE=25000000
lib_deps =
    ${common.lib_deps_shared}
    https://github.com/hytech-racing/HT_CAN/releases/download/264/can_lib.tar.gz
    https://github.com/adafruit/Adafruit_NeoPixel.git
    https://github.com/adafruit/Adafruit_SHARP_Memory_Display
    https://github.com/adafruit/Adafruit-GFX-Library

; DFU upload — press BOOT button before flashing
; * Build to verify the on-car software
; * Upload requires BOOT button held during reset
[env:dash-dfu-prod]
extends         = genericSTM32H750VB
upload_protocol = dfu

; ST-Link upload and debug — requires ST-Link hardware dongle
; * Upload without button pressing
; * Full hardware debugging with breakpoints
[env:dash-stlink-prod]
extends         = genericSTM32H750VB
upload_protocol = stlink
debug_tool      = stlink
debug_svd_path  = Dashboard/svd/STM32H750x.svd
debug_speed     = 24000
