; Firmware Monorepo PlatformIO configuration file
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; ─────────────────────────────────────────────────────────────────────
; NAMING CONVENTION (standardized across all boards)
;   <board>-prod              production build, flashed to the vehicle
;   <board>_SIL_tests         Software-in-the-Loop: native, every hardware
;                              interface mocked, run via `pio test -e ...`
; ─────────────────────────────────────────────────────────────────────


; ─────────────────────────────────────────────────────────────────────
; SHARED — libs every subsystem uses
; ─────────────────────────────────────────────────────────────────────
[common]
lib_deps_shared =
    etlcpp/Embedded Template Library@20.39.4
    nanopb/Nanopb@0.4.91

; ─────────────────────────────────────────────────────────────────────
; SHARED — Hardware libs every on-board Teensy env needs
; HT_CAN and HT_proto still use tarballs.
; ─────────────────────────────────────────────────────────────────────
[hw_common]
lib_deps =
    https://github.com/hytech-racing/HT_CAN/releases/download/264/can_lib.tar.gz
    https://github.com/hytech-racing/HT_proto/releases/download/2026-06-14T06_30_48/hytech_msgs_pb_lib.tar.gz
    https://github.com/ssilverman/QNEthernet#v0.26.0
    https://github.com/KSU-MS/pio-git-hash-gen#7998b5b3f8a2464209b0e73338717998bcf511ee
    blemasle/MCP23017@^2.0.0
    arkhipenko/TaskScheduler@^3.8.5

; ─────────────────────────────────────────────────────────────────────
; SHARED — build settings every Teensy env inherits
; ─────────────────────────────────────────────────────────────────────
[teensy_common]
platform          = teensy@5.2.0
board             = teensy41
framework         = arduino
monitor_speed     = 115200
upload_protocol   = teensy-cli
lib_ldf_mode      = deep+
build_unflags     = -std=gnu++11
build_flags       =
    -std=c++17
    -D TEENSY_OPT_SMALLEST_CODE
check_tool        = clangtidy
check_severity    = medium, high
check_flags       =
    clangtidy: --config-file=./.clang-tidy
check_src_filters =
    +<include/*>
    +<lib/*>
    +<src/*>
extra_scripts     = pre:scripts/set_directory.py
lib_extra_dirs    =
    .pio/libdeps/shared
    shared-lib

; ─────────────────────────────────────────────────────────────────────
; SHARED — build settings every STM32 env inherits (Dashboard only)
; ─────────────────────────────────────────────────────────────────────
[stm32_common]
framework         = arduino
monitor_speed     = 115200
build_unflags     = -std=gnu++11
check_tool        = clangtidy
check_severity    = medium, high
check_flags       =
    clangtidy: --config-file=./.clang-tidy
check_src_filters =
    +<include/*>
    +<lib/*>
    +<src/*>
test_framework    = googletest
extra_scripts     = pre:scripts/set_directory.py
lib_extra_dirs    =
    .pio/libdeps/shared
    shared-lib

; ─────────────────────────────────────────────────────────────────────
; SHARED — native SIL test environments
; ─────────────────────────────────────────────────────────────────────
[native_common]
platform        = native
test_framework  = googletest
build_unflags   = -std=gnu++11
extra_scripts   = pre:scripts/set_directory.py
lib_ldf_mode    = deep+
lib_extra_dirs  = shared-lib

; ─────────────────────────────────────────────────────────────────────
; Default environments
; ─────────────────────────────────────────────────────────────────────
[platformio]
default_envs = acu-prod, ccu-prod, vcf-prod, vcr-prod, dash-dfu-prod





; ═════════════════════════════════════════════════════════════════════
; ACU — Accumulator Control Unit
; ═════════════════════════════════════════════════════════════════════

[env:acu-prod]
extends          = teensy_common
custom_subsystem = ACU
test_framework   = googletest
build_src_filter =
    +<**/*.cpp>
    -<main_can_test.cpp>
    -<main_ethernet_test.cpp>
    -<main_spi_dma_test.cpp>
    -<main_spi_test.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}
    SPI

; SIL (Software-in-the-Loop) Test Environment.
; * BUILD to verify the systems compile and run correctly.
; * DO NOT UPLOAD. This is a test-only environment.
; * TEST via `pio test -e acu_SIL_tests` — NOT `pio run`, since
;   build_src_filter excludes PROJECT_SRC_DIR entirely.
[env:acu_SIL_tests]
custom_subsystem = ACU
extends          = native_common
build_flags      =
    -std=c++17
    -g
    -D TESTING_SYSTEMS
build_src_filter =
    -<*>
lib_ignore       = shared-interfaces-lib
lib_deps         =
    ${common.lib_deps_shared}
    google/googletest@^1.15.2

; BMS SPI (DMA) Test Environment. This environment is for testing the optimized BMS read implementation.
; * BUILD to verify the test code compiles.
; * UPLOAD to flash to Teensy and run BMS driver tests.
; * Use serial monitor at 115200 baud to view test output.
[env:acu_spi_test]
extends          = teensy_common
custom_subsystem = ACU
test_framework   = googletest
build_src_filter =
    -<**/*.cpp>
    +<main_spi_dma_test.cpp>
    +<ACU_Constants.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}
    SPI





; ═════════════════════════════════════════════════════════════════════
; CCU — Central Control Unit
; ═════════════════════════════════════════════════════════════════════

[env:ccu-prod]
