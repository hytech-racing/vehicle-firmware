; HT09 Firmware Monorepo PlatformIO configuration file
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ─────────────────────────────────────────────────────────────────────
; SHARED — libs every subsystem uses
; Local paths used for hytech-owned libraries — no version pinning needed
; ─────────────────────────────────────────────────────────────────────
[common]
lib_deps_shared =
    etlcpp/Embedded Template Library@20.39.4
    nanopb/Nanopb@0.4.91

; ─────────────────────────────────────────────────────────────────────
; SHARED — hardware libs every on-board Teensy env needs
; HT_CAN and HT_proto still use tarballs — they are code generation
; tools, not C++ source libraries
; ─────────────────────────────────────────────────────────────────────
[hw_common]
lib_deps =
    https://github.com/hytech-racing/HT_CAN/releases/download/264/can_lib.tar.gz
    https://github.com/hytech-racing/HT_proto/releases/download/2026-06-14T06_30_48/hytech_msgs_pb_lib.tar.gz
    https://github.com/ssilverman/QNEthernet#v0.26.0
    https://github.com/KSU-MS/pio-git-hash-gen#7998b5b3f8a2464209b0e73338717998bcf511ee
    blemasle/MCP23017@^2.0.0
    arkhipenko/TaskScheduler@^3.8.5

; ─────────────────────────────────────────────────────────────────────
; SHARED — build settings every Teensy env inherits
; ─────────────────────────────────────────────────────────────────────
[teensy_common]
platform        = teensy@5.2.0
board           = teensy41
framework       = arduino
monitor_speed   = 115200
upload_protocol = teensy-cli
build_unflags   = -std=gnu++11
build_flags     =
    -std=c++17
    -D TEENSY_OPT_SMALLEST_CODE
check_tool      = clangtidy
check_severity  = medium, high
check_flags     =
    clangtidy: --config-file=./.clang-tidy
check_src_filters =
    +<include/*>
    +<lib/*>
    +<src/*>
test_ignore     =
    test_interfaces
    test_systems
extra_scripts   = pre:scripts/set_directory.py
lib_extra_dirs = .pio/libdeps/shared

; ─────────────────────────────────────────────────────────────────────
; SHARED — build settings every STM32 env inherits (Dashboard only)
; ─────────────────────────────────────────────────────────────────────
[stm32_common]
framework       = arduino
monitor_speed   = 115200
build_unflags   = -std=gnu++11
check_tool      = clangtidy
check_severity  = medium, high
check_flags     =
    clangtidy: --config-file=./.clang-tidy
check_src_filters =
    +<include/*>
    +<lib/*>
    +<src/*>
test_framework  = googletest
extra_scripts   = pre:scripts/set_directory.py
lib_extra_dirs = .pio/libdeps/shared

; ─────────────────────────────────────────────────────────────────────
; SHARED — native test environments
; ─────────────────────────────────────────────────────────────────────
[native_common]
platform        = native
test_framework  = googletest
build_unflags   = -std=gnu++11
extra_scripts   = pre:scripts/set_directory.py

; ─────────────────────────────────────────────────────────────────────
; Default environments
; ─────────────────────────────────────────────────────────────────────
[platformio]
default_envs = ACU, CCU, VCF, VCR, Dashboard_H750_dfu
lib_extra_dirs = .pio/libdeps/shared


; ═════════════════════════════════════════════════════════════════════
; ACU — Accumulator Control Unit
; ═════════════════════════════════════════════════════════════════════
[env:ACU]
extends          = teensy_common
test_framework   = googletest
build_src_filter =
    +<**/*.cpp>
    -<main_test_ethernet.cpp>
    -<main_can_test.cpp>
    -<main_spi_test.cpp>
    -<main_spi_dma_test.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}
    SPI

[env:ACU_test_systems]
extends          = native_common
build_flags      =
    -std=c++17
    -g
    -D TESTING_SYSTEMS
    -I ACU/lib/interfaces/include
build_src_filter =
    -<ACU_Globals.cpp>
    -<ACU_InterfaceTasks.cpp>
    -<main.cpp>
    +<ACU_Constants.cpp>
    +<../test/test_driver.cpp>
lib_ignore       =
    shared-interfaces-lib
    interfaces
lib_deps         =
    ${common.lib_deps_shared}
    google/googletest@^1.15.2
    blemasle/MCP23017@^2.0.0
    ${PROJECT_DIR}/lib/shared_firmware_interfaces

[env:ACU_spi_test]
extends          = teensy_common
test_framework   = googletest
build_src_filter =
    -<**/*.cpp>
    +<main_spi_dma_test.cpp>
    +<ACU_Constants.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}
    SPI


; ═════════════════════════════════════════════════════════════════════
; CCU — Central Control Unit
; ═════════════════════════════════════════════════════════════════════
[env:CCU]
extends          = teensy_common
test_framework   = googletest
lib_ldf_mode     = deep+
build_src_filter =
    +<**/*.cpp>
check_src_filters =
    +<include/*>
    +<lib/*>
    +<src/*>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}
    https://github.com/vindar/ILI9341_T4.git
    https://github.com/adafruit/Adafruit_ILI9341.git
    SPI

[env:CCU_test_systems]
extends          = native_common
build_flags      =
    -std=c++17
    -g
    -D TESTING_SYSTEMS
    -I CCU/lib/interfaces/include
build_src_filter =
    -<main.cpp>
    +<../test/test_maincharge.cpp>
lib_ignore       = interfaces
lib_deps         =
    ${common.lib_deps_shared}
    google/googletest@^1.15.2


; ═════════════════════════════════════════════════════════════════════
; VCF — Vehicle Control Front
; ═════════════════════════════════════════════════════════════════════
[env:VCF]
extends          = teensy_common
test_framework   = googletest
lib_ldf_mode = deep+
build_src_filter =
    +<*.cpp>
    -<test_ethernet_main.cpp>
    -<test_adcs.cpp>
    -<test_pedals_main.cpp>
    -<test_can.cpp>
    -<test_orbis.cpp>
check_src_filters =
    +<include/*>
    +<lib/*>
    +<src/*>
    -<src/old_main.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}
    https://github.com/adafruit/Adafruit_NeoPixel.git

[env:VCF_test_systems]
extends          = native_common
build_flags      =
    -std=c++17
    -g
    -D TESTING_SYSTEMS
build_src_filter =
    -<**/*.cpp>
    +<../test/test_systems/main.cpp>
test_ignore      =
    test_interfaces*
lib_deps         =
    ${common.lib_deps_shared}
    google/googletest@^1.15.2

[env:VCF_test_orbis]
extends          = teensy_common
build_src_filter =
    +<*.cpp>
    +<test_orbis.cpp>
    -<test_ethernet_main.cpp>
    -<test_pedals_main.cpp>
    -<test_adcs.cpp>
    -<test_can.cpp>
    -<main.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}
    https://github.com/adafruit/Adafruit_NeoPixel.git

[env:VCF_test_adcs]
extends          = teensy_common
build_src_filter =
    +<*.cpp>
    -<test_ethernet_main.cpp>
    -<test_pedals_main.cpp>
    -<test_orbis.cpp>
    -<main.cpp>
    -<test_can.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}

[env:VCF_test_can]
extends          = teensy_common
build_src_filter =
    +<*.cpp>
    -<test_ethernet_main.cpp>
    -<test_pedals_main.cpp>
    -<main.cpp>
    -<test_adcs.cpp>
    -<test_orbis.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}

[env:VCF_test_pedals]
extends          = teensy_common
test_framework   = googletest
build_src_filter =
    +<*.cpp>
    -<test_ethernet_main.cpp>
    -<test_adcs.cpp>
    -<test_orbis.cpp>
    -<main.cpp>
    -<test_can.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}


; ═════════════════════════════════════════════════════════════════════
; VCR — Vehicle Control Rear
; ═════════════════════════════════════════════════════════════════════
[env:VCR]
extends          = teensy_common
test_framework   = googletest
build_flags      =
    -std=c++17
    -D TEENSY_OPT_SMALLEST_CODE
    -I VCR/include
build_src_filter =
    +<**/*.cpp>
    -<test_adcs.cpp>
    -<main_can_test.cpp>
check_src_filters =
    +<**/*.cpp>
    +<**/*.h>
    -<test/**>
    -<src/test_adcs.cpp>
    -<src/main_can_test.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}

[env:VCR_test_systems]
extends          = native_common
build_flags      =
    -std=c++17
    -g
    -D TESTING_SYSTEMS
build_src_filter =
    -<VCR_Globals.cpp>
    -<VCR_InterfaceTasks.cpp>
    -<main.cpp>
    +<VCR_Constants.cpp>
    +<../test/test_systems/test_systems.cpp>
lib_ignore       = interfaces
test_ignore      =
    test_interfaces*
lib_deps         =
    ${common.lib_deps_shared}
    google/googletest@^1.15.2

[env:VCR_ethernet_test]
extends          = teensy_common
build_src_filter =
    -<*.cpp>
    +<main_ethernet_test.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}

[env:VCR_test_can]
extends          = teensy_common
build_src_filter =
    +<**/*.cpp>
    -<main.cpp>
    -<controls.cpp>
    -<test_adcs.cpp>
    +<main_can_test.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}

[env:VCR_test_adcs]
extends          = teensy_common
build_src_filter =
    +<**/*.cpp>
    -<main.cpp>
    -<main_can_test.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}


; ═════════════════════════════════════════════════════════════════════
; Dashboard — Driver Display (STM32H750VB)
; ═════════════════════════════════════════════════════════════════════
[genericSTM32H750VB]
extends              = stm32_common
platform             = ststm32
board                = genericSTM32H750VB
board_build.ldscript = Dashboard/STM32H750VB_FLASH.ld
build_flags          =
    -std=c++17
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBD_VID=0x0483
    -D USBD_PID=0x0003
    -D USE_HAL_DRIVER
    -D HAL_PCD_MODULE_ENABLED
    -D HAL_FDCAN_MODULE_ENABLED
    -D HSE_VALUE=25000000
lib_deps =
    ${common.lib_deps_shared}
    https://github.com/hytech-racing/HT_CAN/releases/download/264/can_lib.tar.gz
    https://github.com/adafruit/Adafruit_NeoPixel.git
    https://github.com/adafruit/Adafruit_SHARP_Memory_Display
    https://github.com/adafruit/Adafruit-GFX-Library

[env:Dashboard_H750_dfu]
extends         = genericSTM32H750VB
upload_protocol = dfu

[env:Dashboard_H750_stlink]
extends         = genericSTM32H750VB
upload_protocol = stlink
debug_tool      = stlink
debug_svd_path  = Dashboard/svd/STM32H750x.svd
debug_speed     = 24000

[env:Dashboard_F446RE]
extends         = stm32_common
platform        = ststm32
board           = genericSTM32F446RE
upload_protocol = dfu
build_flags     =
    -std=c++17
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x0003
    -D HAL_PCD_MODULE_ENABLED
    -D HAL_CAN_MODULE_ENABLED
lib_deps =
    ${common.lib_deps_shared}
    https://github.com/pazi88/STM32_CAN.git
    https://github.com/adafruit/Adafruit_NeoPixel.git
    https://github.com/adafruit/Adafruit_SHARP_Memory_Display
    https://github.com/adafruit/Adafruit-GFX-Library