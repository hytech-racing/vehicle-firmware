; ═════════════════════════════════════════════════════════════════════
; VCR — Vehicle Control Rear
; ═════════════════════════════════════════════════════════════════════

; This is the default/main build for VCR
; * Build to verify functionality
; * Upload to compile and flash to Teensy 4.1
[env:vcr-prod]
extends          = teensy_common
custom_subsystem = VCR
test_framework   = googletest
build_flags      =
    -std=c++17
    -D TEENSY_OPT_SMALLEST_CODE
    -I VCR/include
build_src_filter =
    +<**/*.cpp>
    -<test_adcs.cpp>
    -<main_can_test.cpp>
