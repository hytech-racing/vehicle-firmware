; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[common]
lib_deps_shared =
    https://github.com/hytech-racing/shared_firmware_types.git#5e98919bd05951dee3daa3a42a5f73ea3539f093
    https://github.com/hytech-racing/HT_SCHED.git#c13cff762c59dd82a8c273e3e98fd1a80622656d
    etlcpp/Embedded Template Library@20.39.4
    https://github.com/adafruit/Adafruit_SHARP_Memory_Display
    https://github.com/adafruit/Adafruit-GFX-Library

[hw_common]
lib_deps =
    https://github.com/hytech-racing/HT_CAN/releases/download/264/can_lib.tar.gz
    https://github.com/adafruit/Adafruit_NeoPixel.git


[stm32_common]
framework       = arduino
monitor_speed   = 115200
build_unflags   = -std=gnu++11
build_flags     =
    -std=c++17
check_tool      = clangtidy
check_severity  = medium, high
check_flags     =
    clangtidy: --config-file=./.clang-tidy
check_src_filters =
    +<include/*>
    +<lib/*>
    +<src/*>
build_src_filter =
    +<*.cpp>
    -<lib/interfaces/include/lcdInterface.h>
    -<lib/interfaces/src/lcdInterface.cpp>
test_framework  = googletest

[platformio]
default_envs = H750_dfu


[env:genericSTM32F446RE]
extends         = stm32_common
platform        = ststm32
board           = genericSTM32F446RE
upload_protocol = dfu
build_flags     =
    -std=c++17
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x0003
    -D HAL_PCD_MODULE_ENABLED
    -D HAL_CAN_MODULE_ENABLED
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}
    https://github.com/pazi88/STM32_CAN.git

[genericSTM32H750VB]
extends         = stm32_common
platform        = ststm32
board           = genericSTM32H750VB
board_build.ldscript = STM32H750VB_FLASH.ld
build_flags     =
    -std=c++17
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBD_VID=0x0483
    -D USBD_PID=0x0003
    -D USE_HAL_DRIVER
    -D HAL_PCD_MODULE_ENABLED
    -D HAL_FDCAN_MODULE_ENABLED
    -D HSE_VALUE=25000000
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}

[env:H750_dfu]
extends         = genericSTM32H750VB
upload_protocol = dfu

[env:H750_stlink]
extends         = genericSTM32H750VB
upload_protocol = stlink
debug_tool      = stlink
debug_svd_path  = svd/STM32H750x.svd
debug_speed     = 24000