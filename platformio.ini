; ═════════════════════════════════════════════════════════════════════
; Dashboard — Driver Display  (STM32H750VB)
; ═════════════════════════════════════════════════════════════════════
[dashboard_base]
extends              = stm32_common
custom_subsystem     = Dashboard
board                = genericSTM32H750VB
board_build.ldscript = Dashboard/STM32H750VB_FLASH.ld
build_flags =
    ${stm32_common.build_flags}
    -D USBD_VID=0x0483
    -D USBD_PID=0x0003
    -D HAL_PCD_MODULE_ENABLED
    -D HAL_FDCAN_MODULE_ENABLED
    -D HSE_VALUE=25000000
lib_deps =
    ${common.lib_deps_shared}
    ${ht_common.lib_deps}
    https://github.com/adafruit/Adafruit_NeoPixel.git
    https://github.com/adafruit/Adafruit_SHARP_Memory_Display
    https://github.com/adafruit/Adafruit-GFX-Library


; DFU upload — hold BOOT during reset. No dongle needed.
[env:dash-dfu-prod]
extends         = dashboard_base
upload_protocol = dfu


; ST-Link upload + full debug — requires ST-Link dongle.
[env:dash-stlink-prod]
extends         = dashboard_base
upload_protocol = stlink
debug_tool      = stlink
debug_svd_path  = Dashboard/svd/STM32H750x.svd
debug_speed     = 24000





; ═════════════════════════════════════════════════════════════════════
; PDB — Power Distribution Board  (STM32H750VB)
; ═════════════════════════════════════════════════════════════════════
[pdb_base]
extends              = stm32_common
custom_subsystem     = PDB
board                = genericSTM32H750VB
board_build.ldscript = PDB/STM32H750VBTX_FLASH.ld
build_flags =
    ${stm32_common.build_flags}
    -D USBD_VID=0x0483
    -D USBD_PID=0x0003
    -D HAL_PCD_MODULE_ENABLED
    -D HAL_ADC_MODULE_ENABLED
    -D HAL_FDCAN_MODULE_ENABLED
    -D HAL_SMBUS_MODULE_ENABLED
    -D HSE_VALUE=16000000
lib_deps =
    ${common.lib_deps_shared}
    ${ht_common.lib_deps}


; DFU upload — hold BOOT during reset. No dongle needed.
[env:pdb-dfu-prod]
extends         = pdb_base
upload_protocol = dfu


; ST-Link upload + full debug — requires ST-Link dongle.
[env:pdb-stlink-prod]
extends         = pdb_base
upload_protocol = stlink
debug_tool      = stlink
debug_svd_path  = PDB/svd/STM32H750x.svd
debug_speed     = 24000





