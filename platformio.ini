; PlatformIO Configuration File for HyTech Racing Monorepo.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ─────────────────────────────────────────────────────────────────────
; SHARED — Libraries every subsystem uses
; ─────────────────────────────────────────────────────────────────────
[common]
lib_deps_shared =
    https://github.com/hytech-racing/shared_firmware_types.git
    https://github.com/hytech-racing/shared_firmware_systems.git
    https://github.com/hytech-racing/HT_SCHED.git
    etlcpp/Embedded Template Library@20.39.4
    nanopb/Nanopb@0.4.91

; ─────────────────────────────────────────────────────────────────────
; SHARED — Hardware libraries every on-board Teensy env needs
; ─────────────────────────────────────────────────────────────────────
[hw_common]
lib_deps =
    https://github.com/hytech-racing/HT_CAN/releases/download/264/can_lib.tar.gz
    https://github.com/hytech-racing/HT_proto/releases/download/2026-06-14T06_30_48/hytech_msgs_pb_lib.tar.gz
    https://github.com/hytech-racing/shared_firmware_interfaces.git
    https://github.com/ssilverman/QNEthernet#v0.26.0
    https://github.com/KSU-MS/pio-git-hash-gen#7998b5b3f8a2464209b0e73338717998bcf511ee
    blemasle/MCP23017@^2.0.0
    arkhipenko/TaskScheduler@^3.8.5

; ─────────────────────────────────────────────────────────────────────
; SHARED — build settings every Teensy env inherits
; ─────────────────────────────────────────────────────────────────────
[teensy_common]
platform        = teensy@5.2.0
board           = teensy41
framework       = arduino
monitor_speed   = 115200
upload_protocol = teensy-cli
build_unflags   = -std=gnu++11
build_flags     =
    -std=c++17
    -D TEENSY_OPT_SMALLEST_CODE
check_tool      = clangtidy
check_severity  = medium, high
check_flags     =
    clangtidy: --config-file=./.clang-tidy
check_src_filters =
    +<include/*>
    +<lib/*>
    +<src/*>
test_ignore     =
    test_interfaces
    test_systems

; ─────────────────────────────────────────────────────────────────────
; SHARED — build settings every STM32 env inherits (Dashboard only)
; ─────────────────────────────────────────────────────────────────────
[stm32_common]
framework       = arduino
monitor_speed   = 115200
build_unflags   = -std=gnu++11
check_tool      = clangtidy
check_severity  = medium, high
check_flags     =
    clangtidy: --config-file=./.clang-tidy
check_src_filters =
    +<include/*>
    +<lib/*>
    +<src/*>
test_framework  = googletest

; ─────────────────────────────────────────────────────────────────────
; Default environments — built when you run pio run with no arguments
; ─────────────────────────────────────────────────────────────────────
[platformio]
default_envs = acu-prod, ccu-prod, vcf-prod, vcr-prod, dash-dfu-prod





; ═════════════════════════════════════════════════════════════════════
; ACU — Accumulator Control Unit
; ═════════════════════════════════════════════════════════════════════

; This is the default/main build for ACU
; * Build to verify functionality
; * Upload to compile and flash to Teensy 4.1
[env:acu-prod]
extends          = teensy_commpioon
src_dir          = ACU/src
test_dir         = ACU/test
test_framework   = googletest
build_src_filter =
    +<**/*.cpp>
    -<main_test_ethernet.cpp>
    -<main_can_test.cpp>
    -<main_spi_test.cpp>
    -<main_spi_dma_test.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}
    SPI

; Test Systems/Unit Tests Environemnt. This is only for compiling and uploading the hardware-abstracted code.
; * BUILD to verify the SYSTEMS compile.
; * DO NOT UPLOAD. This is a test-only environment.
; * TEST to run all unit tests
[env:acu_test_systems]
src_dir          = ACU/src
test_dir         = ACU/test
platform         = native
test_framework   = googletest
build_unflags    = -std=gnu++11
build_flags      =
    -std=c++17
    -g
    -D TESTING_SYSTEMS
    -I ACU/lib/interfaces/include
build_src_filter =
    -<ACU_Globals.cpp>
    -<ACU_InterfaceTasks.cpp>
    -<main.cpp>
    +<ACU_Constants.cpp>
    +<../test/test_driver.cpp>
lib_ignore       =
    shared-interfaces-lib
    interfaces
lib_deps         =
    ${common.lib_deps_shared}
    google/googletest@^1.15.2
    blemasle/MCP23017@^2.0.0
    https://github.com/hytech-racing/shared_firmware_interfaces.git

; BMS SPI Test Environment. This environment is for testing the optimized BMS read implementation.
; * BUILD to verify the test code compiles.
; * UPLOAD to flash to Teensy and run BMS driver tests.
; * Use serial monitor at 115200 baud to view test output.
[env:acu_spi_test]
extends          = teensy_common
src_dir          = ACU/src
test_dir         = ACU/test
test_framework   = googletest
build_src_filter =
    -<**/*.cpp>
    +<main_spi_dma_test.cpp>
    +<ACU_Constants.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}
    SPI





