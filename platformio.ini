; ═════════════════════════════════════════════════════════════════════
; VCR — Vehicle Control Rear
; ═════════════════════════════════════════════════════════════════════

[env:vcr-prod]
extends           = teensy_common
custom_subsystem  = VCR
test_framework    = googletest
build_flags       =
    -std=c++17
    -D TEENSY_OPT_SMALLEST_CODE
    -I VCR/include
build_src_filter  =
    +<**/*.cpp>
    -<main_adc_test.cpp>
    -<main_can_test.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}

; SIL (Software-in-the-Loop) Test Environment.
; Compiles and runs all systems-level unit tests natively, with every
; hardware interface swapped for its mock implementation.
; * BUILD to verify the systems compile and run correctly.
; * DO NOT UPLOAD. This is a test-only environment.
; * TEST via `pio test -e vcr_SIL_tests` — NOT `pio run`, since
;   build_src_filter excludes PROJECT_SRC_DIR entirely.
[env:vcr_SIL_tests]
custom_subsystem = VCR
extends          = native_common
build_flags      =
    -std=c++17
    -g
    -D TESTING_SYSTEMS
build_src_filter =
    -<*>
lib_ignore       =
    shared-interfaces-lib
    interfaces
lib_deps         =
    ${common.lib_deps_shared}
    google/googletest@^1.15.2
    ; mock_interfaces   ; TODO: uncomment once the mock_interfaces bundle exists

; CAN hardware test
[env:vcr_can_test]
extends          = teensy_common
custom_subsystem = VCR
build_src_filter =
    +<**/*.cpp>
    -<main.cpp>
    -<controls.cpp>
    -<main_adc_test.cpp>
    +<main_can_test.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}

; ADC hardware test
[env:vcr_adcs_test]
extends          = teensy_common
custom_subsystem = VCR
build_src_filter =
    +<**/*.cpp>
    -<main.cpp>
    -<main_can_test.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}


; ═════════════════════════════════════════════════════════════════════
; Dashboard — Driver Display (STM32H750VB)
; ═════════════════════════════════════════════════════════════════════
[genericSTM32H750VB]
extends              = stm32_common
custom_subsystem     = Dashboard
platform             = ststm32
board                = genericSTM32H750VB
board_build.ldscript = Dashboard/STM32H750VB_FLASH.ld
build_flags          =
    -std=c++17
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBD_VID=0x0483
    -D USBD_PID=0x0003
    -D USE_HAL_DRIVER
    -D HAL_PCD_MODULE_ENABLED
    -D HAL_FDCAN_MODULE_ENABLED
    -D HSE_VALUE=25000000
lib_deps =
    ${common.lib_deps_shared}
    https://github.com/hytech-racing/HT_CAN/releases/download/264/can_lib.tar.gz
    https://github.com/adafruit/Adafruit_NeoPixel.git
    https://github.com/adafruit/Adafruit_SHARP_Memory_Display
    https://github.com/adafruit/Adafruit-GFX-Library

; DFU upload — press BOOT button before flashing
; * Build to verify the on-car software
; * Upload requires BOOT button held during reset
[env:dash-dfu-prod]
extends         = genericSTM32H750VB
upload_protocol = dfu

; ST-Link upload and debug — requires ST-Link hardware dongle
; * Upload without button pressing
; * Full hardware debugging with breakpoints
[env:dash-stlink-prod]
extends            = genericSTM32H750VB
upload_protocol    = stlink
debug_tool         = stlink
debug_svd_path     = Dashboard/svd/STM32H750x.svd
debug_speed        = 24000

[env:Dashboard_F446RE]
extends            = stm32_common
custom_subsystem   = Dashboard
platform           = ststm32
board              = genericSTM32F446RE
upload_protocol    = dfu
build_flags        =
    -std=c++17
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x0003
    -D HAL_PCD_MODULE_ENABLED
    -D HAL_CAN_MODULE_ENABLED
lib_deps =
    ${common.lib_deps_shared}
    https://github.com/pazi88/STM32_CAN.git
    https://github.com/adafruit/Adafruit_NeoPixel.git
    https://github.com/adafruit/Adafruit_SHARP_Memory_Display
    https://github.com/adafruit/Adafruit-GFX-Library


; ═════════════════════════════════════════════════════════════════════
; HIL Environments — Hardware-In-The-Loop
; ═════════════════════════════════════════════════════════════════════
[env:hil_test_can]
extends          = teensy_common
custom_subsystem = HIL
build_src_filter =
    +<*.cpp>
lib_deps =
    etlcpp/Embedded Template Library@20.39.4