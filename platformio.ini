    +<**/*.cpp>
    +<**/*.h>
    -<test/**>
    -<src/test_adcs.cpp>
    -<src/main_can_test.cpp>
lib_deps =
    ${common.lib_deps_shared}
    ${hw_common.lib_deps}

; Test Systems/Unit Tests Environemnt. This is only for compiling and uploading the hardware-abstracted code.
; * BUILD to verify the SYSTEMS compile.
; * DO NOT UPLOAD. This is a test-only environment.
; * TEST to run all unit tests
[env:vcr_unit_tests]
