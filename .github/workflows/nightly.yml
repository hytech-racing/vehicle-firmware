name: Nightly
# Full build + test + lint of every subsystem on the integration branches, every night.
# Unlike CI there is no path filter: everything is built, so problems that CI's path
# filter can miss (dependency drift, cross-subsystem breakage) still show up.
# Failures show as a red X in the Actions tab.

# ─────────────────────────────────────────────────────────────────────
#                             Triggers
# NOTE: GitHub only runs `schedule` from the workflow file on the default
# branch (main), so this file has to be on main before the nightly runs.
# Each job checks out the branch it builds explicitly (matrix.branch).
# ─────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC = 3:00 AM EST / 4:00 AM EDT
  # Manual run from the Actions tab ("Run workflow")
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a nightly that is already running
concurrency:
  group: nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ═══════════════════════════════════════════════════════════════════
  #                         JOB 1 — format
  # Same check as CI, once per branch.
  # ═══════════════════════════════════════════════════════════════════
  format:
    name: Format check (${{ matrix.branch }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        branch: [develop, main]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Check formatting
        run: |
          if [ ! -f .clang-format ]; then
            echo "::notice::No .clang-format file found — skipping format check"
            exit 0
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-20

          mapfile -d '' files < <(
            git ls-files -z -- ACU CCU VCF VCR RDC Dashboard \
              | grep -zE '\.(c|cc|cpp|h|hpp|ino)$' || true
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No C/C++ files to check."
            exit 0
          fi

          echo "Checking ${#files[@]} files…"
          clang-format-20 --dry-run --Werror "${files[@]}"

  # ═══════════════════════════════════════════════════════════════════
  #                         JOB 2 — build
  # One runner per (branch, subsystem). Each job looks up its own build and
  # test environments from that branch's platformio.ini, so branches with
  # different environments (or a subsystem one branch doesn't have yet)
  # are handled without editing this file.
  # ═══════════════════════════════════════════════════════════════════
  build:
    name: Build & test (${{ matrix.branch }} / ${{ matrix.subsystem }})
    runs-on: ubuntu-latest

    strategy:
      # Keep going when one subsystem fails, so one night shows every failure
      fail-fast: false
      matrix:
        branch: [develop, main]
        subsystem: [ACU, CCU, VCF, VCR, RDC, Dashboard]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      # Look up this subsystem's build env (from default_envs) and *_SIL_tests
      # envs using custom_subsystem, the same way CI does.
      - name: Map ${{ matrix.subsystem }} to PlatformIO environments
        id: map
        env:
          SUBSYSTEM: ${{ matrix.subsystem }}
        run: |
          python3 - <<'EOF'
          import configparser, os

          subsystem = os.environ["SUBSYSTEM"]

          config = configparser.ConfigParser(interpolation=None)
          config.read("platformio.ini")

          def resolve_subsystem(section, depth=0):
            if depth > 10 or not config.has_section(section):
              return None
            if config.has_option(section, "custom_subsystem"):
              return config.get(section, "custom_subsystem")
            if config.has_option(section, "extends"):
              parent = config.get(section, "extends").split(",")[0].strip()
              parent_section = parent if parent.startswith("env:") or config.has_section(parent) else f"env:{parent}"
              return resolve_subsystem(parent_section, depth + 1)
            return None

          default_envs = [e.strip() for e in config.get("platformio", "default_envs").split(",")]
          build_env = next((e for e in default_envs if resolve_subsystem(f"env:{e}") == subsystem), "")

          test_envs = [
            section[len("env:"):]
            for section in config.sections()
            if section.startswith("env:")
            and section.lower().endswith("_sil_tests")
            and resolve_subsystem(section) == subsystem
          ]

          if not build_env:
            print(f"::notice::{subsystem} has no default_envs entry on this branch, skipping")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"build_env={build_env}\n")
            f.write(f"test_envs={' '.join(test_envs)}\n")
          EOF

      - uses: actions/cache@v4
        if: steps.map.outputs.build_env != ''
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - uses: actions/setup-python@v5
        if: steps.map.outputs.build_env != ''
        with:
          python-version: '3.11'

      # Same pinned version as CI
      - name: Install PlatformIO
        if: steps.map.outputs.build_env != ''
        run: pip install platformio==6.2.0

      - name: Build ${{ matrix.subsystem }}
        id: build
        if: steps.map.outputs.build_env != ''
        run: pio run -e ${{ steps.map.outputs.build_env }}

      # Every test env runs even if an earlier one fails, so all failures show up
      - name: Test ${{ matrix.subsystem }}
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.map.outputs.test_envs != '' }}
        run: |
          failed=0
          for TEST_ENV in ${{ steps.map.outputs.test_envs }}; do
            echo "→ Running $TEST_ENV"
            pio test -e "$TEST_ENV" || failed=1
          done
          exit $failed

      # Same severity gate as CI
      - name: Lint ${{ matrix.subsystem }}
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pio check -e ${{ steps.map.outputs.build_env }} --fail-on-defect high
