name: CI
# More detailed notes/explanation on bookstack!

# ─────────────────────────────────────────────────────────────────────
#                             Triggers
# ─────────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  # Manual run from the Actions tab ("Run workflow") on any branch, no PR needed
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────
#                             Permissions
# contents: read  — lets the workflow check out the repo
# pull-requests: write — lets the workflow post comments on PRs
# ─────────────────────────────────────────────────────────────────────
permissions:
  contents: read
  pull-requests: write

# ─────────────────────────────────────────────────────────────────────
#                             Concurrency
# If someone pushes again to the same PR while CI is still running, the
# older run is cancelled — no point finishing a build of stale code.
# Pushes to develop are never cancelled, so every merge gets a full run.
# ─────────────────────────────────────────────────────────────────────
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ─────────────────────────────────────────────────────────────────────
#                             Defaults
# Explicitly using bash makes GitHub run every step with
# `bash -eo pipefail`.
# ─────────────────────────────────────────────────────────────────────
defaults:
  run:
    shell: bash

jobs:
  # ═══════════════════════════════════════════════════════════════════
  #                         JOB 1 — changes
  # Detects which subsystems were modified in this PR/push so we only
  # build what actually changed.
  # ═══════════════════════════════════════════════════════════════════
  changes:
    name: Detect changed subsystems
    runs-on: ubuntu-latest
    outputs:
      # Raw list of changed subsystem names, e.g. ["ACU","CCU"].
      subsystems: ${{ steps.filter.outputs.changes }}
      # Same list but each entry also has the PlatformIO environment name
      # alongside the subsystem label.
      matrix: ${{ steps.map.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      # Detects which subsystem folders changed in this push/PR.
      # platformio.ini, .clang-tidy and shared-lib/ are used by every
      # subsystem, so a change to any of them rebuilds everything.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ACU:       ['ACU/**', 'platformio.ini', '.clang-tidy', 'shared-lib/**']
            CCU:       ['CCU/**', 'platformio.ini', '.clang-tidy', 'shared-lib/**']
            VCF:       ['VCF/**', 'platformio.ini', '.clang-tidy', 'shared-lib/**']
            VCR:       ['VCR/**', 'platformio.ini', '.clang-tidy', 'shared-lib/**']
            RDC:       ['RDC/**', 'platformio.ini', '.clang-tidy', 'shared-lib/**']
            Dashboard: ['Dashboard/**', 'platformio.ini', '.clang-tidy', 'shared-lib/**']

      # For each changed subsystem, look up its build/test environment
      # names from platformio.ini use the `custom_subsystem` key.
      - name: Map subsystems to real PlatformIO environments
        id: map
        if: steps.filter.outputs.changes != '[]'
        env:
          CHANGED_SUBSYSTEMS: ${{ steps.filter.outputs.changes }}
        run: |
          python3 - <<'EOF'
          import configparser, json, os, sys

          changed = json.loads(os.environ["CHANGED_SUBSYSTEMS"])

          config = configparser.ConfigParser(interpolation=None)
          config.read("platformio.ini")

          def resolve_subsystem(section, depth=0):
            if depth > 10 or not config.has_section(section):
              return None
            if config.has_option(section, "custom_subsystem"):
              return config.get(section, "custom_subsystem")
            if config.has_option(section, "extends"):
              parent = config.get(section, "extends").split(",")[0].strip()
              parent_section = parent if parent.startswith("env:") or config.has_section(parent) else f"env:{parent}"
              return resolve_subsystem(parent_section, depth + 1)
            return None

          default_envs = [e.strip() for e in config.get("platformio", "default_envs").split(",")]

          mapping = {name: {"build_env": None, "test_envs": []} for name in changed}

          for env_name in default_envs:
            subsystem = resolve_subsystem(f"env:{env_name}")
            if subsystem in mapping:
              mapping[subsystem]["build_env"] = env_name

          for section in config.sections():
            if not section.startswith("env:"):
              continue
            env_name = section[len("env:"):]
            subsystem = resolve_subsystem(section)
            if subsystem not in mapping:
              continue
            if env_name.lower().endswith("_sil_tests"):
              mapping[subsystem]["test_envs"].append(env_name)

          matrix = []
          for subsystem, envs in mapping.items():
            if envs["build_env"] is None:
              print(f"::error::No default_envs entry resolves to custom_subsystem = {subsystem}", file=sys.stderr)
              sys.exit(1)
            matrix.append({
              "subsystem": subsystem,
              "build_env": envs["build_env"],
              "test_envs": envs["test_envs"],
            })

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"matrix={json.dumps(matrix)}\n")
          EOF

  # ═══════════════════════════════════════════════════════════════════
  #                         JOB 2 — format
  # Checks that all C/C++ source files match the rules in .clang-format.
  # Runs on every PR.
  # ═══════════════════════════════════════════════════════════════════
  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          if [ ! -f .clang-format ]; then
            echo "::notice::No .clang-format file found — skipping format check"
            exit 0
          fi

          # Pin the clang-format version: different versions can format
          # the same code slightly differently. Developers should use the
          # same version locally (pip install clang-format==23.1.1).
          # .clang-format uses options that need clang-format 20 or newer.
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-20

          # Only check tracked files inside the subsystem folders, so
          # build output and downloaded libraries are never checked.
          mapfile -d '' files < <(
            git ls-files -z -- ACU CCU VCF VCR RDC Dashboard \
              | grep -zE '\.(c|cc|cpp|h|hpp|ino)$' || true
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No C/C++ files to check."
            exit 0
          fi

          echo "Checking ${#files[@]} files…"
          clang-format-20 --dry-run --Werror "${files[@]}"

  # ═══════════════════════════════════════════════════════════════════
  #                         JOB 3 — build
  # Runs in parallel for each changed subsystem using a matrix strategy.
  # A matrix strategy mean one independent runner per subsystem. So ACU,
  # CCU, VCF etc. all build at the same time.
  # ═══════════════════════════════════════════════════════════════════
  build:
    name: Build & test (${{ matrix.subsystem }})
    needs: changes
    # Only run if at least one subsystem changed.
    if: needs.changes.outputs.subsystems != '[]'
    runs-on: ubuntu-latest

    strategy:
      # fail-fast: false means if ACU fails, CCU/VCF/VCR/Dashboard
      #   still continue running.
      # fromJson converts the JSON string output from the changes job
      #   back into an actual array that the matrix can iterate over.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # Caches ~/.platformio between runs so the ARM toolchain,
      # Teensy platform, and library downloads are reused.
      # The cache key includes a hash of platformio.ini — if the ini
      # changes the cache is invalidated and everything re-downloads fresh.
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      # PlatformIO is a Python based tool/application. We pin Python to 3.11 for
      # reproducibility.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PlatformIO is pinned so CI doesn't change behavior on its own when
      # a new release comes out. Set this to the version the team uses
      # locally (`pio --version`) and bump it deliberately.
      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      # Compile the firmware for this subsystem.
      # tee captures the build output to a file so we can parse it
      # for memory usage in the next step. pipefail (see `defaults` at
      # the top) makes this step fail if pio fails, not just if tee fails.
      - name: Build ${{ matrix.subsystem }}
        id: build
        run: pio run -e ${{ matrix.build_env }} 2>&1 | tee build_output.txt

      # Memory usage check.
      # Parses the build output for memory usage and fails CI if any
      # region exceeds 90% (warns above 80%). Two formats are supported:
      #
      # 1. PlatformIO's generic size check (most boards):
      #      Flash: [========  ]  80.3% (used 105432 bytes from 131072 bytes)
      #      RAM:   [===       ]  32.1% (used 52488 bytes from 163840 bytes)
      #
      # 2. teensy_size (Teensy 4.x), which lists bytes used per region and
      #    bytes free; usage is used / (used + free):
      #      teensy_size:   FLASH: code:122432, data:18704, headers:8364   free for files:7976964
      #      teensy_size:    RAM1: variables:54912, code:119432, padding:11640   free for local variables:338304
      #      teensy_size:    RAM2: variables:12416  free for malloc/new:511872
      #
      # If neither format is found, the step fails instead of silently
      # reporting 0%.
      - name: Check memory usage
        id: memory
        if: steps.build.outcome == 'success'
        run: |
          python3 - <<'EOF'
          import re, sys

          with open("build_output.txt") as f:
            output = f.read()

          # Region name -> (bytes used, bytes total)
          regions = {}

          # Format 1: PlatformIO's generic size check
          for name in ("Flash", "RAM"):
            m = re.search(
              rf"^{name}:\s+\[[=\s]*\]\s+[\d.]+%\s+\(used (\d+) bytes from (\d+) bytes\)",
              output, re.MULTILINE,
            )
            if m:
              regions[name] = (int(m.group(1)), int(m.group(2)))

          # Format 2: teensy_size. Everything before "free for ..." is a
          # list of name:bytes fields that together make up the used space.
          if not regions:
            pattern = r"teensy_size:\s+(FLASH|RAM1|RAM2):\s+(.*?)\s+free for [^:]+:\s*(\d+)"
            for name, fields, free in re.findall(pattern, output):
              used = sum(int(v) for v in re.findall(r"\w+:\s*(\d+)", fields))
              regions[name] = (used, used + int(free))

          if not regions:
            print("::error::Could not parse memory usage from build output")
            sys.exit(1)

          failed = False
          with open("summary.md", "a") as s:
            for name, (used, total) in regions.items():
              percent = 100 * used / total if total else 0.0
              status = "⚠️" if percent > 80 else "✅"
              print(f"{name}: {percent:.1f}% ({used:,} / {total:,} bytes)")
              s.write(f"| {name} | {percent:.1f}% ({used:,} / {total:,} B) | {status} |\n")
              if percent > 90:
                print(f"::error::{name} usage is {percent:.1f}% — exceeds 90% limit")
                failed = True

          sys.exit(1 if failed else 0)
          EOF

      # Runs unit tests on the native platform. Subsystems with no
      # *_sil_tests environment (e.g. Dashboard) are skipped.
      # !cancelled() means this runs even if the memory check failed, so
      # one failure doesn't hide the results of the other steps.
      # Every test env runs even if an earlier one fails, so you see all
      # failures in one run instead of one at a time.
      - name: Test ${{ matrix.subsystem }}
        id: test
        if: ${{ !cancelled() && steps.build.outcome == 'success' && join(matrix.test_envs, '') != '' }}
        run: |
          failed=0
          for TEST_ENV in ${{ join(matrix.test_envs, ' ') }}; do
            echo "→ Running $TEST_ENV"
            pio test -e "$TEST_ENV" || failed=1
          done
          exit $failed

      # Runs lint/clang-tidy static analysis.
      # --fail-on-defect high means only high severity issues block
      # the build. Medium severity issues are reported but don't fail.
      # Anything listed in WarningsAsErrors in .clang-tidy counts as high.
      # Runs independently of tests: a failing test doesn't skip lint.
      - name: Lint ${{ matrix.subsystem }}
        id: lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pio check -e ${{ matrix.build_env }} --fail-on-defect high

      # Uploads the firmware artifacts on the PR: compiled .hex file
      # github.sha is the full commit hash — including it in the name
      # makes each artifact uniquely identifiable.
      # Artifacts are auto-deleted after 30 days to avoid filling up storage.
      - name: Upload ${{ matrix.subsystem }} firmware artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.subsystem }}-firmware-${{ github.sha }}
          path: .pio/build/${{ matrix.build_env }}/firmware.hex
          if-no-files-found: ignore
          retention-days: 30

      # Writes a summary table to the GitHub Actions job summary page.
      # This is visible by clicking on the job in the Actions tab —
      # no need to dig through logs to see pass/fail at a glance.
      - name: Write job summary
        if: always()
        env:
          BUILD:  ${{ steps.build.outcome }}
          MEMORY: ${{ steps.memory.outcome }}
          TEST:   ${{ steps.test.outcome }}
          LINT:   ${{ steps.lint.outcome }}
        run: |
          # Converts a step outcome into a readable result.
          result() {
            case "$1" in
              success) echo "✅ passed" ;;
              skipped) echo "⏭️ skipped" ;;
              failure) echo "❌ failed" ;;
              *)       echo "⏸️ ${1:-not run}" ;;
            esac
          }

          {
            echo "## ${{ matrix.subsystem }} CI Results"
            echo ""
            echo "| Step   | Result |"
            echo "|--------|--------|"
            echo "| Build  | $(result "$BUILD") |"
            echo "| Memory | $(result "$MEMORY") |"
            echo "| Test   | $(result "$TEST") |"
            echo "| Lint   | $(result "$LINT") |"
            echo ""
            # Append memory usage from the python script above if it exists
            if [ -f summary.md ]; then
              echo "### Memory Usage"
              echo "| Section | Usage | Status |"
              echo "|---------|-------|--------|"
              cat summary.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Posts (or updates) a comment on the PR with a result table.
      # Each subsystem gets one comment, identified by a hidden marker,
      # which is edited on every push instead of adding a new comment.
      # Only runs for PRs from branches in this repo: PRs from forks get a
      # read-only token, so commenting would fail the job.
      - name: Post PR comment
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const subsystem = '${{ matrix.subsystem }}';
            const sha       = '${{ github.sha }}'.substring(0, 7);
            const build     = '${{ steps.build.outcome }}';
            const memory    = '${{ steps.memory.outcome }}';
            const test      = '${{ steps.test.outcome }}';
            const lint      = '${{ steps.lint.outcome }}';

            // Helper — converts a step outcome string to an emoji
            const icon = outcome =>
              outcome === 'success'  ? '✅' :
              outcome === 'skipped'  ? '⏭️' :
              outcome === 'failure'  ? '❌' : '⏸️';

            // Tests may legitimately be skipped (no test env), so only a
            // test *failure* counts against the overall result.
            const passed =
              build  === 'success' &&
              memory === 'success' &&
              lint   === 'success' &&
              test   !== 'failure';
            const overall = passed ? '✅' : '❌';

            // Hidden marker used to find this subsystem's comment later.
            const marker = `<!-- ci-result:${subsystem} -->`;

            const body = [
              marker,
              `### ${overall} ${subsystem} — \`${sha}\``,
              '',
              '| Step   | Result |',
              '|--------|--------|',
              `| Build  | ${icon(build)} ${build || 'not run'} |`,
              `| Memory | ${icon(memory)} ${memory || 'not run'} |`,
              `| Test   | ${icon(test)} ${test || 'not run'} |`,
              `| Lint   | ${icon(lint)} ${lint || 'not run'} |`,
            ].join('\n');

            const params = {
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            };

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...params, per_page: 100 },
            );
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ ...params, body });
            }

  # ═══════════════════════════════════════════════════════════════════
  #                    JOB 4 — all-checks-passed
  # A single, stable check that always runs on every PR regardless
  # of which subsystems changed (or none). This is the one check we
  # mark as "required" in branch protection
  # ═══════════════════════════════════════════════════════════════════
  all-checks-passed:
    needs: [changes, format, build]
    # `always()` makes this job run even if `build` failed or was
    # skipped entirely — otherwise a failure upstream would skip this
    # job too, and a skipped required check blocks merging forever,
    # which defeats the purpose.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          echo "changes job result: ${{ needs.changes.result }}"
          echo "format job result:  ${{ needs.format.result }}"
          echo "build job result:   ${{ needs.build.result }}"

          # Only "success" and "skipped" count as passing. Anything else
          # (failure, cancelled, timed out) blocks the merge.
          failed=0
          check() {
            local name="$1" result="$2"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::$name job did not pass (result: $result)"
              failed=1
            fi
          }

          check "changes" "${{ needs.changes.result }}"
          check "format"  "${{ needs.format.result }}"
          check "build"   "${{ needs.build.result }}"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo "All checks passed."
